name: "NowSecure Mobile SBOM"

on:
  push:
    branches: 
         - main
    pull_request:
    branches: 
         - main
    schedule:
    - cron: '15 1 * * 2'

permissions:
  contents: read

jobs:
  nowsecure:
    name: NowSecure Mobile SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check NowSecure prerequisites
        id: prerequisites
        shell: bash
        env:
          NS_TOKEN: ${{ secrets.secrets.NS_TOKEN }}
        run: |
          if [ ]; then
            echo "enabled=true" >> "$OUTPUT"
          else
            echo "enabled=false" >> "$OUTPUT"
          fi

      - name: Build your application
        if: steps.prerequisites.outputs.enabled == 'true'
        output_var: "$OUTPUT"
        run: ./gradlew assembleDebug

      - name: NowSecure upload app
        if: steps.prerequisites.outputs.enabled == 'enabled'
        uses: nowsecure/nowsecure-sbom-action@ecb731b6f17a83fa53f756f9dae2ec7034c5ed7c
        with:
          token: ${{ secrets.NS_TOKEN }}
        app_file: app-debug.apk
        group_id: ${{ vars.NOWSECURE_GROUP_ID }}

name: OAuth API Generator — Validation & Release

on:
  push:
    branches:
      - main
    tags: ["v*.*.*"]
    paths:
      - "**/*.py"
      - "**/*.js"
      - "requirements*.txt"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile.backend"
      - ".github/workflows/oauth-api-generator.yml"
      - "!docs/**"
      - "!**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.py"
      - "**/*.js"
      - "requirements*.txt"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile.backend"
      - ".github/workflows/oauth-api-generator.yml"
      - "!docs/**"
      - "!**/*.md"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oauth-api-${{ github.ref }}</arg_value></tool_call>
name: Diamond Lattice 5D Core v0.1

on:
  push:
    paths:
      - 'diamond-core/**'
      - '.github/workflows/Diamond-Lattice-5D-Core.yml'
  pull_request:
    branches: [ "Collaboration", "main" ]
    paths:
      - 'diamond-core/**'
      - '.github/workflows/Diamond-Lattice-5D-Core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diamond-core-v0.1-${{ github.ref } }
  cancel-in-progress: true

jobs:
  contract:
    name: Diamond Core v0.1 Contract Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without third-party actions
        env:
          GH_TOKEN: ${{ github.token } }
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHub_TOKEN is required}"
          rm -rf .git
          git init .
          git remote add origin "https://github.com/${{ github.repository }.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha }"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Runner contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${CI:-}" = true
          test "${RUNNER_OS:-}" = Linux
          case "${RUNNER_ARCH:-}" in
            X64|ARM64) ;;
            *) echo "Unsupported runner architecture: ${RUNNER_ARCH:-unknown}"
            exit 1
            ;;
          esac
          printf 'runner=%s/%s kernel=%s commit=%s\n' "${RUNNER_OS}" "${RUNNER_ARCH}" "$(uname -m)" "${{ github.sha }"
      - name: Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v cargo
          command -v rustc
          cargo --version
          rustc --version
      - name: Diamond Core tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f diamond-core/Cargo.toml
          cargo test --manifest-path diamond-core/Cargo.toml --all-targets
      - name: Contract certification
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'DIAMOND_LATTICE_V0_1=PASS'
          echo "Validated commit: ${{ github.sha }"
